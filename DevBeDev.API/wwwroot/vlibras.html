<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1c1c1f;
      overflow: hidden;
    }
    #texto-alvo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #252529;
      color: #e1e1e6;
      font-family: sans-serif;
      font-size: 12px;
      padding: 8px;
      text-align: center;
      z-index: 99999;
      box-sizing: border-box;
      border-bottom: 1px solid #614de6;
    }
    [vw-plugin-wrapper] {
      width: 100vw !important;
      height: calc(100vh - 34px) !important;
      top: 34px !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      max-width: 100% !important;
    }
  </style>
</head>
<body>
  <div id="texto-alvo">Toque em um texto sublinhado</div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br');
    const intervalo = setInterval(() => {
      const btn = document.querySelector('[vw-access-button]');
      if (btn) {
        btn.click();
        clearInterval(intervalo);
      }
    }, 500);
  </script>
</body>
</html>
